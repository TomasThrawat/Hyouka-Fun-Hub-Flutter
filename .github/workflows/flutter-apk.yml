name: Shared Flutter CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shared-ci:
    uses: TomasThrawat/hyouka-flutter-workflows/.github/workflows/flutter-ci.yml@v1.1.1
    with:
      flutter-channel: stable
      run-analyze: true
      run-tests: true
      check-format: false
      build-apk: true
      target-platform: android-arm64
      generate-android: true
      android-project-name: hyouka_fun_hub
      android-organization: com.example
      run-emulator-tests: false
      run-security-audit: true
      fail-on-security-findings: false
      artifact-name: hyouka-fun-hub-arm64-apk
