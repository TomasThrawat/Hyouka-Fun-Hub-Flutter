name: Flutter Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Configure Git default branch
        run: git config --global init.defaultBranch main
      - name: Generate Android platform
        run: flutter create --platforms=android --project-name hyouka_fun_hub .
      - name: Pub get
        run: flutter pub get
      - name: Apply Dart fixes
        run: dart fix --apply
      - name: Format Dart
        run: dart format --output=write lib test
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build ARM64 APK
        run: flutter build apk --release --target-platform android-arm64
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: hyouka-fun-hub-arm64-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
